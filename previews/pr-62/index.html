    const nomes = { expected: 'Aprovado', unexpected: 'Falhou', flaky: 'Instável', skipped: 'Ignorado', passed: 'Aprovado', failed: 'Falhou', timedOut: 'Tempo esgotado', interrupted: 'Interrompido' };

    const criar = (tag, texto, classe) => {

      if (classe) elemento.className = classe;
      return elemento;
    };
    document.getElementById('resumo').textContent = `${relatorio.testes.length} teste(s)${relatorio.startTime ? ' • ' + new Date(relatorio.startTime).toLocaleString('pt-BR') : ''}`;

      const option = criar('option', hashtag);
      option.value = hashtag;
      filtroHashtag.append(option);
    }
    function mostrarHashtags(teste) {
      if (!teste.hashtags?.length) return null;
      const etiquetas = criar('div', null, 'hashtags');
      for (const hashtag of teste.hashtags) etiquetas.append(criar('span', hashtag, 'hashtag'));
      return etiquetas;
    }
    function passos(steps) {
      const listaPassos = criar('ol');
      for (const step of steps) {
        const item = criar('li', `${step.title}${step.skipped ? ' (ignorado)' : ''}`);
        if (step.imagens?.length) item.append(galeria(step.imagens));
        if (step.steps?.length) item.append(passos(step.steps));
        listaPassos.append(item);
      }
      return listaPassos;
    }
    function galeria(imagens) {
      const container = criar('div', null, 'galeria');
      imagens.forEach((imagem, indice) => {
        const figura = criar('figure');
        const link = criar('a');
        link.href = imagem.url;
        link.target = '_blank';
        link.rel = 'noopener';
        const img = criar('img');
        img.src = imagem.url;
        img.alt = imagem.titulo || `Captura ${indice + 1}`;
        img.loading = 'lazy';
        link.append(img);

        container.append(figura);

    function mostrar(teste) {

    function renderizarLista() {

        .filter(({ teste }) => !selecionada || teste.hashtags?.includes(selecionada));
      for (const { teste, indice } of testesVisiveis) {
        const link = criar('a', null, 'teste');

        if (etiquetas) link.append(etiquetas);

    function atualizarPagina() {

      const teste = rota ? relatorio.testes[Number(rota[1])] : null;

      paginaTeste.hidden = !teste;
      for (const link of lista.querySelectorAll('a')) link.removeAttribute('aria-current');
