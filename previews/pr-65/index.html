        detalhes.append(criar('h3', `Execução ${(resultado.retry ?? 0) + 1} — ${nomes[resultado.status] ?? resultado.status} (${Math.round(resultado.duration ?? 0)} ms)`));
        for (const erro of resultado.errors) detalhes.append(criar('pre', erro.message ?? erro.snippet ?? JSON.stringify(erro)));
        detalhes.append(criar('h3', 'Passos'));
        detalhes.append(resultado.steps.length ? passos(resultado.steps) : criar('p', 'Nenhum passo disponível.', 'muted'));
        detalhes.append(criar('h3', 'Capturas de tela'));
        if (!resultado.imagens.length) detalhes.append(criar('p', 'Nenhuma captura disponível.', 'muted'));
        else {
          const galeria = criar('div', null, 'galeria');
          resultado.imagens.forEach((imagem, indice) => {
            const figura = criar('figure');
            const link = criar('a');
            link.href = imagem.url;
            link.target = '_blank';
            link.rel = 'noopener';
            const img = criar('img');
            img.src = imagem.url;
            img.alt = imagem.titulo || `Captura ${indice + 1}`;
            img.loading = 'lazy';
            link.append(img);
            figura.append(link, criar('figcaption', imagem.titulo || `Captura ${indice + 1}`));
            galeria.append(figura);
          });
          detalhes.append(galeria);
        }
      }
    }
    function renderizarLista() {
      lista.replaceChildren();
      const selecionada = filtroHashtag.value;
      const testesVisiveis = relatorio.testes
        .map((teste, indice) => ({ teste, indice }))
        .filter(({ teste }) => !selecionada || teste.hashtags?.includes(selecionada));
      for (const { teste, indice } of testesVisiveis) {
        const link = criar('a', null, 'teste');
        link.href = `#teste=${indice}`;
        link.append(criar('strong', teste.titulo));
        if (teste.modificadoNoPR) link.append(criar('small', 'Teste novo/modificado neste PR', 'alterado'));
        link.append(criar('small', `${nomes[teste.outcome] ?? teste.outcome} • ${teste.caminho}`));
        const etiquetas = mostrarHashtags(teste);
        if (etiquetas) link.append(etiquetas);
        lista.append(link);
      }
      if (!testesVisiveis.length) lista.append(criar('p', relatorio.testes.length ? 'Nenhum teste corresponde a esta hashtag.' : 'Nenhum teste no relatório.', 'muted'));
    }
    filtroHashtag.addEventListener('change', renderizarLista);
    renderizarLista();
    function atualizarPagina() {
      const rota = location.hash.match(/^#teste=(\d+)$/);
      const teste = rota ? relatorio.testes[Number(rota[1])] : null;
      paginaLista.hidden = Boolean(teste);
      paginaTeste.hidden = !teste;
      for (const link of lista.querySelectorAll('a')) link.removeAttribute('aria-current');
      if (teste) {
        lista.querySelector(`a[href="#teste=${Number(rota[1])}"]`)?.setAttribute('aria-current', 'true');
        mostrar(teste);
      }
    }
    window.addEventListener('hashchange', atualizarPagina);
    atualizarPagina();
  </script>
</body>
</html>
