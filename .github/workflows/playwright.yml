name: Playwright Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ '**' ]
    types: [ opened, synchronize, reopened, closed ]
jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm install
    - name: Install Playwright Browsers
      run: npx playwright install chromium --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - name: Check Playwright report
      id: report
      if: always()
      run: |
        if [[ -f playwright-report/index.html ]]; then
          echo "ready=true" >> "$GITHUB_OUTPUT"
        else
          echo "ready=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Upload Playwright report
      id: report_artifact
      uses: actions/upload-artifact@v4
      if: always() && steps.report.outputs.ready == 'true'
      with:
        name: playwright-report
        path: playwright-report/
    - name: Add PR preview link to job summary
      if: always() && steps.report_artifact.conclusion == 'success' && github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPOSITORY_OWNER: ${{ github.repository_owner }}
        REPOSITORY_NAME: ${{ github.event.repository.name }}
      run: |
        echo "[View PR #$PR_NUMBER Playwright report](https://$REPOSITORY_OWNER.github.io/$REPOSITORY_NAME/previews/pr-$PR_NUMBER/)" >> "$GITHUB_STEP_SUMMARY"
