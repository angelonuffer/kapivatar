<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relatório de testes - Kapivatar</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #172033; background: #f3f5f9; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { background: #263b67; color: white; padding: 1.5rem max(1rem, calc((100% - 1100px) / 2)); }
    h1 { margin: 0 0 .4rem; font-size: 1.6rem; }
    header p { margin: 0; color: #dce5f7; }
    main { max-width: 1100px; margin: auto; padding: 1rem; }
    .panel { background: white; border-radius: .6rem; padding: 1rem; box-shadow: 0 2px 8px #17203312; min-width: 0; }
    .voltar { display: inline-block; margin-bottom: 1rem; padding: .55rem .8rem; color: white; background: #315aa9; border: 0; border-radius: .35rem; text-decoration: none; }
    h2 { font-size: 1.2rem; margin: 0 0 1rem; overflow-wrap: anywhere; }
    h3 { margin: 1.3rem 0 .5rem; }
    .lista { display: grid; gap: .5rem; }
    button { font: inherit; text-align: left; cursor: pointer; }
    .teste { display: block; color: inherit; text-decoration: none; background: #f5f7fb; border: 1px solid #d5dce9; border-radius: .4rem; padding: .7rem; width: 100%; overflow-wrap: anywhere; }
    .teste:focus-visible, .voltar:focus-visible { outline: 2px solid #315aa9; outline-offset: 2px; }
    .teste[aria-current="true"] { border-color: #315aa9; background: #eaf0ff; }
    .teste strong, .teste small { display: block; }
    .teste small, .muted { color: #59677e; margin-top: .3rem; }
    .teste .alterado { color: #315aa9; font-weight: 600; }
    .filtros { display: flex; align-items: center; gap: .5rem; margin-bottom: 1rem; }
    .filtros select { font: inherit; max-width: 100%; }
    .hashtags { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .4rem; }
    .hashtag { color: #315aa9; background: #eaf0ff; border-radius: 999px; padding: .1rem .5rem; font-size: .85rem; }
    .status { font-weight: 600; }
    .expected, .passed { color: #147040; }
    .unexpected, .failed, .timedOut, .interrupted { color: #b12232; }
    .flaky { color: #875300; }
    ol { padding-left: 1.5rem; }
    li { padding: .2rem 0; overflow-wrap: anywhere; }
    .galeria { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: .8rem; }
    figure { margin: 0; }
    img { display: block; width: 100%; height: auto; border: 1px solid #d5dce9; border-radius: .3rem; }
    figcaption { font-size: .85rem; margin-top: .3rem; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #fff3f3; padding: .7rem; }
    @media (max-width: 700px) { header { padding: 1rem; } }
  </style>
</head>
<body>
  <header><h1>Relatório de testes</h1><p id="resumo"></p></header>
  <main>
    <section class="panel" id="pagina-lista">
      <a class="voltar" href="../../">Voltar para a lista de PRs</a>
      <h2>Testes</h2>
      <div class="filtros"><label for="filtro-hashtag">Filtrar por hashtag</label><select id="filtro-hashtag"><option value="">Todas as hashtags</option></select></div>
      <div class="lista" id="lista"></div>
    </section>
    <section class="panel" id="pagina-teste" hidden><button class="voltar" id="voltar" type="button">Voltar para a lista de testes</button><div id="detalhes" aria-live="polite"></div></section>
  </main>
  <script>
    /* DADOS_DO_RELATORIO */
    const nomes = { expected: 'Aprovado', unexpected: 'Falhou', flaky: 'Instável', skipped: 'Ignorado', passed: 'Aprovado', failed: 'Falhou', timedOut: 'Tempo esgotado', interrupted: 'Interrompido' };
    const lista = document.getElementById('lista');
    const filtroHashtag = document.getElementById('filtro-hashtag');
    const paginaLista = document.getElementById('pagina-lista');
    const paginaTeste = document.getElementById('pagina-teste');
    const detalhes = document.getElementById('detalhes');
    document.getElementById('voltar').addEventListener('click', () => { location.hash = ''; });
    const criar = (tag, texto, classe) => {
      const elemento = document.createElement(tag);
      if (texto != null) elemento.textContent = texto;
      if (classe) elemento.className = classe;
      return elemento;
    };
    document.getElementById('resumo').textContent = `${relatorio.testes.length} teste(s)${relatorio.startTime ? ' • ' + new Date(relatorio.startTime).toLocaleString('pt-BR') : ''}`;
    const hashtags = [...new Set(relatorio.testes.flatMap((teste) => teste.hashtags ?? []))].sort((a, b) => a.localeCompare(b, 'pt-BR'));
    for (const hashtag of hashtags) {
      const option = criar('option', hashtag);
      option.value = hashtag;
      filtroHashtag.append(option);
    }
    function mostrarHashtags(teste) {
      if (!teste.hashtags?.length) return null;
      const etiquetas = criar('div', null, 'hashtags');
      for (const hashtag of teste.hashtags) etiquetas.append(criar('span', hashtag, 'hashtag'));
      return etiquetas;
    }
    function passos(steps) {
      const listaPassos = criar('ol');
      for (const step of steps) {
        const item = criar('li', `${step.title}${step.skipped ? ' (ignorado)' : ''}`);
        if (step.imagens?.length) item.append(galeria(step.imagens));
        if (step.steps?.length) item.append(passos(step.steps));
        listaPassos.append(item);
      }
      return listaPassos;
    }
    function galeria(imagens) {
      const container = criar('div', null, 'galeria');
      imagens.forEach((imagem, indice) => {
        const figura = criar('figure');
        const link = criar('a');
        link.href = imagem.url;
        link.target = '_blank';
        link.rel = 'noopener';
        const img = criar('img');
        img.src = imagem.url;
        img.alt = imagem.titulo || `Captura ${indice + 1}`;
        img.loading = 'lazy';
        link.append(img);
        figura.append(link, criar('figcaption', imagem.titulo || `Captura ${indice + 1}`));
        container.append(figura);
      });
      return container;
    }
    function mostrar(teste) {
      const etiquetas = mostrarHashtags(teste);
      detalhes.replaceChildren(criar('h2', teste.titulo), ...(etiquetas ? [etiquetas] : []), criar('p', `${teste.caminho} • ${teste.projeto}`, 'muted'), criar('p', nomes[teste.outcome] ?? teste.outcome, `status ${teste.outcome}`));
      if (!teste.resultados.length) detalhes.append(criar('p', 'Nenhuma execução disponível.'));
      for (const resultado of teste.resultados) {
        detalhes.append(criar('h3', `Execução ${(resultado.retry ?? 0) + 1} — ${nomes[resultado.status] ?? resultado.status} (${Math.round(resultado.duration ?? 0)} ms)`));
        for (const erro of resultado.errors) detalhes.append(criar('pre', erro.message ?? erro.snippet ?? JSON.stringify(erro)));
        detalhes.append(criar('h3', 'Passos'));
        detalhes.append(resultado.steps.length ? passos(resultado.steps) : criar('p', 'Nenhum passo disponível.', 'muted'));
        if (resultado.imagensSemPasso?.length) {
          detalhes.append(criar('h3', 'Capturas sem passo associado'));
          detalhes.append(galeria(resultado.imagensSemPasso));
        } else if (!resultado.imagens.length) {
          detalhes.append(criar('p', 'Nenhuma captura disponível.', 'muted'));
        }
      }
    }
    function renderizarLista() {
      lista.replaceChildren();
      const selecionada = filtroHashtag.value;
      const testesVisiveis = relatorio.testes
        .map((teste, indice) => ({ teste, indice }))
        .filter(({ teste }) => !selecionada || teste.hashtags?.includes(selecionada));
      for (const { teste, indice } of testesVisiveis) {
        const link = criar('a', null, 'teste');
        link.href = `#teste=${indice}`;
        link.append(criar('strong', teste.titulo));
        if (teste.modificadoNoPR) link.append(criar('small', 'Teste novo/modificado neste PR', 'alterado'));
        link.append(criar('small', `${nomes[teste.outcome] ?? teste.outcome} • ${teste.caminho}`));
        const etiquetas = mostrarHashtags(teste);
        if (etiquetas) link.append(etiquetas);
        lista.append(link);
      }
      if (!testesVisiveis.length) lista.append(criar('p', relatorio.testes.length ? 'Nenhum teste corresponde a esta hashtag.' : 'Nenhum teste no relatório.', 'muted'));
    }
    filtroHashtag.addEventListener('change', renderizarLista);
    renderizarLista();
    function atualizarPagina() {
      const rota = location.hash.match(/^#teste=(\d+)$/);
      const teste = rota ? relatorio.testes[Number(rota[1])] : null;
      paginaLista.hidden = Boolean(teste);
      paginaTeste.hidden = !teste;
      for (const link of lista.querySelectorAll('a')) link.removeAttribute('aria-current');
      if (teste) {
        lista.querySelector(`a[href="#teste=${Number(rota[1])}"]`)?.setAttribute('aria-current', 'true');
        mostrar(teste);
      }
    }
    window.addEventListener('hashchange', atualizarPagina);
    atualizarPagina();
  </script>
</body>
</html>
